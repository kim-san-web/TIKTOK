<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Downloader Pro | Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); }

        .premium-lock {
            backdrop-filter: blur(12px);
            background: rgba(15, 23, 42, 0.8);
        }

        .loader-ring {
            width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #qrcode img { margin: auto; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <!-- Payment Modal -->
    <div id="paywall" class="fixed inset-0 z-[100] flex items-center justify-center p-4 hidden">
        <div class="premium-lock absolute inset-0"></div>
        <div class="glass relative z-10 w-full max-w-md p-8 rounded-[2.5rem] shadow-2xl text-center">
            <div class="w-16 h-16 bg-yellow-400 rounded-2xl flex items-center justify-center text-slate-900 mx-auto mb-6 shadow-lg shadow-yellow-400/20">
                <i class="fas fa-crown text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black mb-2">Unlock Pro Access</h2>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Pay <span class="font-bold text-indigo-500">$1.00 USD</span> for 24-hour unlimited downloads.</p>
            
            <div class="bg-white p-4 rounded-3xl mb-6 inline-block" id="qrcode"></div>
            
            <div class="space-y-3">
                <button onclick="simulatePayment()" id="verifyBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl flex items-center justify-center gap-2">
                    <span>VERIFY PAYMENT</span>
                </button>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Scan with Bakong or Any Banking App</p>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white shadow-xl">
                    <i class="fas fa-bolt"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tighter">TK PRO <span class="text-indigo-500">V2</span></h1>
                    <span id="accessBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-500">GUEST MODE</span>
                </div>
            </div>
            <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl glass flex items-center justify-center"><i class="fas fa-moon"></i></button>
        </header>

        <main id="mainContent" class="opacity-30 pointer-events-none transition-opacity duration-500">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8">
                    <section class="glass rounded-[2rem] p-8 shadow-2xl">
                        <h2 class="text-2xl font-black mb-6">Enter Video URL</h2>
                        <div class="flex gap-3">
                            <input type="text" id="videoUrl" placeholder="Paste link here..." class="flex-1 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 p-4 rounded-2xl outline-none focus:border-indigo-500 transition-all font-medium">
                            <button onclick="analyzeVideo()" id="mainBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 rounded-2xl font-black transition-all">START</button>
                        </div>
                        <div id="resultCard" class="hidden mt-8 p-6 bg-slate-100 dark:bg-slate-900/50 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700">
                           <div id="resTitle" class="font-bold mb-4 text-lg">Video Title Here</div>
                           <div id="linkGrid" class="grid grid-cols-1 gap-2"></div>
                        </div>
                    </section>
                </div>

                <div class="lg:col-span-4 space-y-6">
                    <div class="glass rounded-[2.5rem] p-6">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Account Status</h3>
                        <div id="expiryTimer" class="text-sm font-bold text-indigo-500">Access Locked</div>
                        <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-800">
                             <button onclick="showPaywall()" id="renewBtn" class="w-full py-3 bg-indigo-500/10 text-indigo-500 rounded-xl text-xs font-black hover:bg-indigo-500 hover:text-white transition-all">UPGRADE TO PRO</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const apiKey = ""; // Shared API Key
        const BAKONG_ID = "yourname@aba"; // REPLACE WITH YOUR REAL BAKONG ID
        let expiryTime = localStorage.getItem('tk_pro_expiry');

        window.onload = () => {
            checkAccess();
            generateKHQR();
        };

        function checkAccess() {
            const now = Date.now();
            const main = document.getElementById('mainContent');
            const badge = document.getElementById('accessBadge');
            const timer = document.getElementById('expiryTimer');
            const paywall = document.getElementById('paywall');

            if (expiryTime && parseInt(expiryTime) > now) {
                // User has access
                main.classList.remove('opacity-30', 'pointer-events-none');
                badge.textContent = "PRO ACTIVE";
                badge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-green-500 text-white";
                paywall.classList.add('hidden');
                
                const timeLeft = Math.round((parseInt(expiryTime) - now) / (1000 * 60 * 60));
                timer.textContent = `Expires in ~${timeLeft} hours`;
                document.getElementById('renewBtn').classList.add('hidden');
            } else {
                // Access expired
                main.classList.add('opacity-30', 'pointer-events-none');
                badge.textContent = "GUEST MODE";
                paywall.classList.remove('hidden');
                timer.textContent = "Access Locked";
                document.getElementById('renewBtn').classList.remove('hidden');
            }
        }

        function generateKHQR() {
            // Standard KHQR Format (Simplifed for Display)
            // In production, use the Bakong KHQR SDK to generate a valid EmvCo string
            const mockKhqrString = `00020101021230${BAKONG_ID.length}${BAKONG_ID}52045999530384054041.005802KH5906TKPROV26010Phnom Penh6304`;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: mockKhqrString,
                width: 200,
                height: 200,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        function simulatePayment() {
            const btn = document.getElementById('verifyBtn');
            btn.innerHTML = '<div class="loader-ring"></div> <span>CHECKING...</span>';
            
            // Simulating API call to Bakong to check transaction
            setTimeout(() => {
                const dayInMs = 24 * 60 * 60 * 1000;
                const newExpiry = Date.now() + dayInMs;
                localStorage.setItem('tk_pro_expiry', newExpiry);
                expiryTime = newExpiry;
                
                btn.innerHTML = '<span>SUCCESS!</span>';
                btn.className = "w-full bg-green-500 text-white font-black py-4 rounded-2xl";
                
                setTimeout(() => {
                    checkAccess();
                }, 1000);
            }, 2000);
        }

        async function analyzeVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            if(!url) return;

            const btn = document.getElementById('mainBtn');
            btn.innerHTML = '<div class="loader-ring"></div>';
            
            try {
                const prompt = `Extract direct video MP4 download links for: ${url}. Return JSON: {"title": "str", "links": [{"label": "720p", "url": "url"}]}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });

                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);
                
                document.getElementById('resultCard').classList.remove('hidden');
                document.getElementById('resTitle').textContent = result.title;
                const grid = document.getElementById('linkGrid');
                grid.innerHTML = result.links.map(l => `
                    <a href="${l.url}" target="_blank" class="flex items-center justify-between p-4 bg-indigo-600 text-white rounded-xl font-bold">
                        <span>Download ${l.label}</span>
                        <i class="fas fa-arrow-down"></i>
                    </a>
                `).join('');
            } catch (err) {
                console.error(err);
            } finally {
                btn.innerHTML = 'START';
            }
        }

        function showPaywall() {
            document.getElementById('paywall').classList.remove('hidden');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</body>
</html>
